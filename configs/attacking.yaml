attacking:
  input_path: data/processed/model_training.csv
  team_predictions_path: data/models/team_score/walk_forward_team_predictions.csv
  minutes_predictions_path: data/models/minutes_state/walk_forward_predictions.csv
  model_dir: data/models/attacking
  validation_seasons:
    - 2023-24
    - 2024-25
    - 2025-26
  feature_profiles:
    - event_history
    - expected_history
    - expected_history_and_market
  random_state: 104
  minimum_rate: 0.0001
  maximum_rate: 3.0
  candidate_shrinkage_minutes: 450
  shrinkage_minutes:
    - 0
    - 225
    - 450
    - 900
    - 1800
  assist_ratio_multiplier:
    minimum: 0.80
    maximum: 1.20
    step: 0.05
  parameter_grid:
    learning_rate:
      - 0.04
      - 0.08
    max_iter:
      - 100
    max_leaf_nodes:
      - 7
      - 15
    min_samples_leaf:
      - 30
    l2_regularization:
      - 1.0
