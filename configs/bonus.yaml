bonus:
  input_path: data/processed/model_training.csv
  team_predictions_path: data/models/team_score/walk_forward_team_predictions.csv
  minutes_predictions_path: data/models/minutes_state/walk_forward_predictions.csv
  attacking_predictions_path: data/models/attacking/walk_forward_predictions.csv
  defensive_predictions_path: data/models/defensive/walk_forward_predictions.csv
  misc_events_predictions_path: data/models/misc_events/walk_forward_predictions.csv
  model_dir: data/models/bonus
  validation_seasons:
    - 2024-25
    - 2025-26
  feature_profiles:
    - components
    - components_and_history
    - components_history_and_market
  random_state: 104
  tuning_simulations: 300
  final_simulations: 1500
  residual_scales:
    - 0.75
    - 1.0
    - 1.25
    - 1.5
  parameter_grid:
    loss:
      - squared_error
      - absolute_error
    learning_rate:
      - 0.04
      - 0.08
    max_iter:
      - 120
    max_leaf_nodes:
      - 7
      - 15
    min_samples_leaf:
      - 30
    l2_regularization:
      - 1.0
